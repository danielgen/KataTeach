# Concept definitions for linear probe training
# Each concept maps to a label derived from the snorkel analysis

concepts:
  # Tactical concepts (binary)
  cut:
    type: binary
    source: cut
    description: "Move separates 2+ opponent groups"
    
  connection:
    type: binary
    source: connection
    description: "Move connects 2+ own groups"
    
  connection_gain:
    type: threshold
    source: connection_strength_gain
    threshold: 1.0
    description: "Move connects multiple groups (gain > 1)"
    
  extension:
    type: binary
    source: extension
    description: "Move is adjacent to own stone"
    
  atari:
    type: binary
    source: atari
    description: "Move puts opponent group in atari"
    
  creates_new_group:
    type: binary
    source: creates_new_group
    description: "Move creates a new separate group"
    
  invasion:
    type: binary
    source: invasion
    description: "Move invades opponent territory"
    
  direct_sacrifice:
    type: binary
    source: direct_sacrifice
    description: "Move places stone in opponent territory (sacrifice)"
    
  indirect_sacrifice:
    type: threshold
    source: indirect_sacrifice
    threshold: 1
    description: "Move causes own stones to flip to opponent territory"
    
  attack:
    type: binary
    source: attack
    description: "Move weakens opponent groups"
    
  killing_attack:
    type: binary
    source: killing_attack
    description: "Move threatens to kill opponent group"
    
  reduce_aji:
    type: binary
    source: reduce_aji
    description: "Move reduces aji/potential of weak opponent stones"
    
  tenuki:
    type: binary
    source: tenuki
    description: "Move ignores local situation to play elsewhere"
    
  only_move:
    type: binary
    source: only_move
    description: "Policy strongly favors single move (>95%)"

  # Continuous concepts (quantile-based labeling)
  building_territory:
    type: quantile
    source: building_count
    q: 0.1
    direction: high
    description: "Move builds significant territory (top 10%)"
    
  solidifying_territory:
    type: quantile
    source: solidification_count
    q: 0.1
    direction: high
    description: "Move solidifies existing territory (top 10%)"
    
  reducing_opponent:
    type: quantile
    source: reduction_count
    q: 0.1
    direction: high
    description: "Move significantly reduces opponent territory (top 10%)"

  # Delta-based concepts (change from before to after)
  territory_gain:
    type: quantile
    source: potential_territory
    q: 0.1
    direction: high
    description: "Move gains significant potential territory (top 10%)"
    
  territory_loss:
    type: quantile
    source: potential_territory
    q: 0.1
    direction: low
    description: "Move loses significant potential territory (bottom 10%)"
    
  influence_expansion:
    type: quantile
    source: influence_count_delta
    q: 0.1
    direction: high
    description: "Move expands influence significantly (top 10%)"
    
  group_strengthening:
    type: quantile
    source: group_strength_delta
    q: 0.1
    direction: high
    description: "Move strengthens own groups significantly (top 10%)"
  
  connectivity_improvement:
    type: quantile
    source: current_group_connectivity_delta
    q: 0.1
    direction: high
    description: "Move improves connectivity of current group significantly (top 10%)"
  
  group_connectivity_improvement:
    type: quantile
    source: group_connectivity_delta
    q: 0.1
    direction: high
    description: "Move improves average connectivity of all own groups (top 10%)"
  
  max_group_strengthening:
    type: quantile
    source: max_group_strength_delta
    q: 0.1
    direction: high
    description: "Move causes maximum single-group strength improvement (top 10%)"
  
  max_connectivity_improvement:
    type: quantile
    source: max_group_connectivity_delta
    q: 0.1
    direction: high
    description: "Move causes maximum single-group connectivity improvement (top 10%)"
  
  influence_strength_change:
    type: quantile
    source: influence_strength_delta
    q: 0.1
    direction: high
    use_abs: true
    description: "Move significantly changes average influence strength (top 10% by magnitude)"
  
  high_urgency:
    type: quantile
    source: urgency
    q: 0.1
    direction: high
    threshold_key: "max"
    description: "Move is in high-urgency region (top 10% by max policy mass)"
  
  regional_building:
    type: quantile
    source: building_count_by_region
    q: 0.1
    direction: high
    threshold_key: "max"
    description: "Move builds significant territory in at least one region (top 10%)"
  
  regional_solidification:
    type: quantile
    source: solidification_count_by_region
    q: 0.1
    direction: high
    threshold_key: "max"
    description: "Move solidifies territory significantly in at least one region (top 10%)"
  
  regional_reduction:
    type: quantile
    source: reduction_count_by_region
    q: 0.1
    direction: high
    threshold_key: "max"
    description: "Move significantly reduces opponent territory in at least one region (top 10%)"

# Feature extraction settings
feature_extraction:
  # How to aggregate spatial features (512, 19, 19) -> (N,)
  aggregation: "global_pool"  # global_pool, move_location, or both
  
  # Include features from specific board location
  include_move_location: true
  
  # Pool type for global aggregation
  pool_type: "mean"  # mean, max, or both

# Training settings
training:
  # Model types to try
  models:
    - logistic_regression
    - linear_svc
  
  # Cross-validation
  cv_folds: 5
  group_column: "game_id"
  
  # Class balancing
  class_weight: "balanced"
  
  # Regularization
  C_values: [0.001, 0.01, 0.1, 1.0, 10.0]


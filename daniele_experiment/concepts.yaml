# Archetype concepts for linear probe training (intent-level)
# Goal: fewer, more meaningful concepts; less brittle than raw deltas.
#
# Best Practice: For sparse quantile sources (e.g., building_count, reduction_count),
# add filters to ensure source > 0 before computing quantiles. Otherwise "top 10%" 
# might mean ">= 1" and labels become binary noise. Example:
#   filters:
#     - {column: building_count, operator: '>', value: 0}
#
# Game Phase Stratification:
#   For quantile concepts, you can set stratify_by_phase: true to compute thresholds
#   separately per game phase (early: moves 1-60, mid: 61-150, end: 151+).
#   This is useful when concept intensity varies significantly by game phase.
#   Example: territory_building might be "high" at different absolute values in
#   opening vs endgame. Without stratification, early-game moves might dominate
#   the quantiles, making endgame moves rarely labeled as positive.

concepts:
  # -------------------------
  # 1) Local tactics (binary)
  # -------------------------
  cut:
    type: binary
    source: cut
    description: "Cut: separates opponent groups (local tactical)."

  connect:
    type: binary
    source: connection
    description: "Connect: joins own groups."

  multi_connect:
    type: threshold
    source: connection_strength_gain
    threshold: 1.0
    description: "Multi-connect: connects multiple groups (gain >= 1.0)."

  extend:
    type: binary
    source: extension
    description: "Extend: adjacent to own stone (shape/extension)."

  atari:
    type: binary
    source: atari
    description: "Atari: puts opponent group in atari."
  
  forcing:
    type: binary
    source: forcing
    description: "Only move: only move has >95% probability."

  tenuki:
    type: binary
    source: tenuki
    description: "Tenuki: plays away from local situation."

  invasion:
    type: binary
    source: invasion
    description: "Invasion: plays into opponent territory / flips region."

  sacrifice_direct:
    type: binary
    source: direct_sacrifice
    description: "Direct sacrifice: stone immediately 'lost' (negative ownership)."

  sacrifice_indirect:
    type: threshold
    source: indirect_sacrifice
    threshold: 1
    description: "Indirect sacrifice: move causes own stones to flip (>= 1)."

  must_live:
    type: binary
    source: must_live
    description: "Move that saves a group from dying (dead in counterfactual, alive after)"

  occupy_corner:
    type: binary
    source: occupy_corner
    description: "First stone played in a corner area (opening corner occupation)"

  approaching_corner:
    type: binary
    source: approaching_corner
    description: "Approach move responding to opponent's corner stone (kakari)"
  # -------------------------------------
  # 2) Combat archetypes (quantile-based)
  # -------------------------------------
  fight_pressure:
    type: quantile
    source: max_attack_intensity
    q: 0.15
    direction: high
    filters:
      - {column: attacked_groups_count, operator: '>=', value: 1}
    description: "Fight pressure: strong local attack pressure (max intensity, only if attacking)."

  fight_wide:
    type: threshold
    source: attacked_groups_count
    threshold: 2
    filters:
      - {column: attacked_groups_count, operator: '>=', value: 1}
    description: "Fight wide: attacks many groups (only among attacking moves)."

  kill_attack:
    type: binary
    source: killing_attack
    description: "Kill threat: attack likely kills / makes group dead."

  aji_reduction:
    type: binary
    source: reduce_aji
    description: "Reduce aji: makes already-dead/weak stones 'more dead' (cleanup)."

  # --------------------------------------------
  # 3) Territory / influence archetypes (quantile)
  # --------------------------------------------
  territory_building:
    type: quantile
    source: building_intensity
    q: 0.15
    direction: high
    stratify_by_phase: true  # Compute quantiles separately per game phase
    filters:
      - {column: move_number, operator: '>=', value: 8}
      - {column: building_intensity, operator: '>', value: 0}
    description: "Build territory: strong creation of new owned points (intensity, not too early). Stratified by phase so early/mid/endgame have separate thresholds."

  territory_securing:
    type: quantile
    source: solidification_intensity
    q: 0.15
    direction: high
    stratify_by_phase: true
    filters:
      - {column: move_number, operator: '>=', value: 8}
      - {column: solidification_intensity, operator: '>', value: 0}
    description: "Secure territory: strengthens already-owned points (solidification intensity). Stratified by phase so early/mid/endgame have separate thresholds."

  opponent_reduction:
    type: quantile
    source: reduction_intensity
    q: 0.15
    direction: high
    stratify_by_phase: true
    filters:
      - {column: move_number, operator: '>=', value: 8}
      - {column: reduction_intensity, operator: '>', value: 0}
    description: "Reduce opponent: strong reduction of opponent territory (reduction intensity). Stratified by phase so early/mid/endgame have separate thresholds."

  influence_surge:
    type: quantile
    source: influence_count_delta
    q: 0.15
    direction: high
    stratify_by_phase: true
    no_drop: true
    filters:
      - {column: move_number, operator: '>=', value: 8}
      - {column: influence_count_delta, operator: '>', value: 0}
    description: "Influence surge: expands influence area significantly. Stratified by phase so early/mid/endgame have separate thresholds."

  urgency_peak:
    type: quantile
    source: urgency
    threshold_key: "max"
    q: 0.15
    direction: high
    no_drop: true
    description: "Urgency peak: move lies in a highly urgent region (max urgency mass)."

  # --------------------------------------------
  # 4) Group-shape / stability shifts (quantile)
  # --------------------------------------------
  group_strength_shift:
    type: quantile
    source: group_strength_delta
    q: 0.15
    direction: high
    use_abs: true
    filters:
      - {column: move_number, operator: '>=', value: 8}
    description: "Group strength shift: large change in current group strength (by magnitude). Note: Consider splitting into group_strength_up and group_strength_down for directional meaning."

  group_connectivity_shift:
    type: quantile
    source: current_group_connectivity_delta
    q: 0.15
    direction: high
    use_abs: true
    filters:
      - {column: move_number, operator: '>=', value: 8}
    description: "Connectivity shift: large change in current group connectivity (by magnitude). Note: Consider splitting into group_connectivity_up and group_connectivity_down for directional meaning."

  sacrifice_commitment:
    type: quantile
    source: sacrifice_intensity
    q: 0.15
    direction: high
    filters:
      - {column: label_sacrifice_direct, operator: '==', value: 1}
    description: "Sacrifice commitment: large immediate self-loss (among direct sacrifices)."

# Feature extraction settings
feature_extraction:
  aggregation: "global_pool"
  include_move_location: true
  pool_type: "mean"

training:
  models: [logistic_regression]
  cv_folds: 5
  group_column: "game_id"
  class_weight: "balanced"
  C_values: [0.001, 0.01, 0.1, 1.0, 10.0]
  min_val_samples: 80
